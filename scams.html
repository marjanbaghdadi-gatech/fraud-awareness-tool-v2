<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latest Scam Trends — Fraud Awareness Assistant</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* ── SCAMS PAGE SPECIFIC STYLES ─────────────────── */
    .page-hero {
      background: linear-gradient(135deg, #000000 0%, #0b1f3a 45%, #163358 100%);
      border-radius: var(--r-xl);
      padding: 48px 52px;
      margin-bottom: 40px;
      color: white;
    }
    .page-hero h1 {
      font-family: 'Lora', serif;
      font-size: var(--text-xl);
      font-weight: 600;
      margin: 0 0 12px;
      color: white;
    }
    .page-hero p {
      font-size: var(--text-sm);
      color: rgba(255,255,255,0.82);
      margin: 0;
      max-width: 560px;
      line-height: 1.7;
    }
    .updated-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 6px 18px;
      font-size: 17px;
      color: rgba(255,255,255,0.85);
      margin-bottom: 20px;
    }
    .updated-badge span { color: #7ee8c8; }

    /* ── TOOLBAR (matches Fraud Witness) ───────────────── */
    .filters-toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--warm-bg);
      /*border-bottom: 1.5px solid var(--border);*/
      padding: 10px 0;
      margin: 0 -52px;
      padding-left: 52px;
      padding-right: 52px;
    }
    .filters-toolbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-btn {
      background: white;
      border: 1.5px solid var(--border);
      color: var(--body-text);
      padding: 5px 14px;
      border-radius: 100px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--teal); color: var(--teal); }
    .filter-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
    .sort-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .sort-group label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .sort-group select {
      background: white;
      border: 1.5px solid var(--border);
      color: var(--body-text);
      padding: 5px 10px;
      border-radius: 7px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    /* ── SCAM CARDS ─────────────────────────────────── */
    .scams-grid {
      display: grid;
      gap: 24px;
    }
    .scam-card {
      background: var(--warm-card);
      border: 1.5px solid var(--border);
      border-radius: var(--r-lg);
      padding: 32px 36px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .scam-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .card-title {
      font-family: 'Lora', serif;
      font-size: var(--text-md);
      font-weight: 600;
      color: var(--navy);
      margin: 0;
      line-height: 1.4;
    }
    .category-badge {
      flex-shrink: 0;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-phone_scam       { background: #fde8e8; color: #9b1c1c; }
    .badge-text_scam        { background: #fef3c7; color: #92400e; }
    .badge-email_scam       { background: #dbeafe; color: #1e40af; }
    .badge-social_media     { background: #ede9fe; color: #5b21b6; }
    .badge-romance_scam     { background: #fce7f3; color: #9d174d; }
    .badge-government_impersonation { background: #fdf3e0; color: #92400e; }
    .badge-tech_support     { background: #d1fae5; color: #065f46; }
    .badge-grandparent_scam { background: #fde8e8; color: #9b1c1c; }
    .badge-other            { background: var(--warm-mist); color: var(--muted); }

    .card-meta {
      font-size: 17px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .card-section-label {
      font-size: 17px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 20px 0 8px;
    }
    .card-body p {
      font-size: var(--text-sm);
      color: var(--body-text);
      margin: 0;
      line-height: 1.8;
    }
    .example-box {
      background: var(--warm-mist);
      border-left: 4px solid var(--teal);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      padding: 16px 20px;
      font-size: var(--text-sm);
      color: var(--body-text);
      font-style: italic;
      line-height: 1.7;
      margin: 8px 0;
    }
    .red-flags-list {
      list-style: none;
      padding: 0;
      margin: 8px 0;
    }
    .red-flags-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: var(--text-sm);
      color: var(--body-text);
      padding: 4px 0;
      line-height: 1.6;
    }
    .red-flags-list li::before {
      content: "✗";
      color: var(--danger);
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .what-to-do-box {
      background: #d1fae5;
      border-radius: var(--r-sm);
      padding: 14px 20px;
      font-size: var(--text-sm);
      color: #065f46;
      font-weight: 500;
      margin: 8px 0;
      line-height: 1.6;
    }
    .what-to-do-box::before {
      content: "✓ ";
      font-weight: 700;
    }
    .card-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .test-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 28px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .test-btn:hover { background: var(--navy2); }

    /* ── EMPTY STATE ─────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state p { font-size: var(--text-sm); }

    /* ── LOADING ─────────────────────────────────────── */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: var(--text-sm);
    }

    @media (max-width: 640px) {
      .page-hero { padding: 32px 24px; }
      .page-hero h1 { font-size: var(--text-lg); }
      .scam-card { padding: 24px 20px; }
      .card-header { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="brand-shield">✓</div>
        <span>Fraud Awareness Assistant</span>
      </div>
      <div class="top-actions">
        <a href="./index.html" class="learn-btn" style="text-decoration:none; display:flex; align-items:center;">← Check a message</a>
        <a href="./fraud-victim-stories/index.html" class="learn-btn" style="text-decoration:none; display:flex; align-items:center;">Victim Stories</a>
        <button class="theme-btn" type="button" aria-label="Toggle theme">☾</button>
      </div>
    </header>

    <main>

      <!-- HERO -->
      <div class="page-hero">
        <div class="updated-badge">🔄 Updated weekly by AI · <span id="lastUpdated">Loading…</span></div>
        <h1>Latest Scam Trends</h1>
        <p>Real scam examples collected from trusted sources like the FTC, AARP, and BBB — written in plain language so you know what to watch for.</p>
      </div>

      <!-- TOOLBAR -->
      <div class="filters-toolbar">
        <div class="filters-toolbar-inner">
          <div class="filters" id="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="phone_scam">📞 Phone</button>
            <button class="filter-btn" data-category="text_scam">💬 Text</button>
            <button class="filter-btn" data-category="email_scam">📧 Email</button>
            <button class="filter-btn" data-category="social_media">📱 Social media</button>
            <button class="filter-btn" data-category="romance_scam">💔 Romance</button>
            <button class="filter-btn" data-category="government_impersonation">🏛 Government</button>
            <button class="filter-btn" data-category="tech_support">💻 Tech support</button>
            <button class="filter-btn" data-category="grandparent_scam">👵 Grandparent</button>
          </div>
          <div class="sort-group">
            <label for="sort-scams">Sort</label>
            <select id="sort-scams">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="category">By category</option>
            </select>
          </div>
        </div>
      </div>

      <!-- SCAMS GRID -->
      <div class="scams-grid" id="scamsGrid">
        <div class="loading-state">Loading latest scam alerts…</div>
      </div>

    </main>

  </div>

  <script>
    const SCAMS_URL = "./scams.json";
    let allScams = [];
    let activeCategory = "all";

    // ── Theme toggle ──────────────────────────────────
    const themeBtn = document.querySelector(".theme-btn");
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      themeBtn.textContent = "☀";
    }
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      themeBtn.textContent = isDark ? "☀" : "☾";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    // ── Category label map ────────────────────────────
    const categoryLabels = {
      phone_scam: "Phone scam",
      text_scam: "Text scam",
      email_scam: "Email scam",
      social_media: "Social media",
      romance_scam: "Romance scam",
      government_impersonation: "Government",
      tech_support: "Tech support",
      grandparent_scam: "Grandparent scam",
      other: "Other",
    };

    // ── Load scams from JSON ──────────────────────────
    async function loadScams() {
      try {
        const res = await fetch(SCAMS_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error("Could not load scam feed");
        allScams = await res.json();
        renderScams();
        updateLastUpdated();
      } catch (e) {
        document.getElementById("scamsGrid").innerHTML =
          `<div class="empty-state"><p>Could not load the scam feed right now. Please check back later.<br>Visit <a href="https://consumer.ftc.gov/scams" target="_blank">ftc.gov/scams</a> for the latest alerts.</p></div>`;
      }
    }

    // ── Update last updated date ──────────────────────
    function updateLastUpdated() {
      if (allScams.length > 0 && allScams[0].updated_at) {
        const date = new Date(allScams[0].updated_at);
        const formatted = date.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
        document.getElementById("lastUpdated").textContent = formatted;
      }
    }

    // ── Render scam cards ─────────────────────────────
    // ── Sort ──────────────────────────────────────────
    const sortSelect = document.getElementById("sort-scams");
    sortSelect.addEventListener("change", renderScams);

    function getSortedScams(scams) {
      const val = sortSelect.value;
      const copy = [...scams];
      if (val === "oldest") return copy.sort((a,b) => new Date(a.date_reported||0) - new Date(b.date_reported||0));
      if (val === "category") return copy.sort((a,b) => (a.category||"").localeCompare(b.category||""));
      return copy.sort((a,b) => new Date(b.date_reported||0) - new Date(a.date_reported||0)); // newest
    }

    function renderScams() {
      const grid = document.getElementById("scamsGrid");
      const filtered = getSortedScams(activeCategory === "all"
        ? allScams
        : allScams.filter(s => s.category === activeCategory));

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><p>No scams found in this category yet.</p></div>`;
        return;
      }

      grid.innerHTML = filtered.map(scam => `
        <div class="scam-card">
          <div class="card-header">
            <h2 class="card-title">${escapeHTML(scam.title)}</h2>
            <span class="category-badge badge-${scam.category}">${categoryLabels[scam.category] || scam.category}</span>
          </div>
          <div class="card-meta">
            Reported: ${escapeHTML(scam.date_reported)} · Source: ${escapeHTML(scam.source)}
          </div>
          <div class="card-body">
            <div class="card-section-label">How it works</div>
            <p>${escapeHTML(scam.how_it_works)}</p>

            ${scam.example_message ? `
            <div class="card-section-label">Example message</div>
            <div class="example-box">${escapeHTML(scam.example_message)}</div>
            ` : ""}

            <div class="card-section-label">Warning signs</div>
            <ul class="red-flags-list">
              ${(scam.red_flags || []).map(f => `<li>${escapeHTML(f)}</li>`).join("")}
            </ul>

            <div class="card-section-label">What to do</div>
            <div class="what-to-do-box">${escapeHTML(scam.what_to_do)}</div>
          </div>
          <div class="card-footer">
            <a href="./index.html?message=${encodeURIComponent(scam.example_message || scam.how_it_works)}"
               class="test-btn">
              🔍 Test this scam
            </a>
          </div>
        </div>
      `).join("");
    }

    // ── Filter buttons ────────────────────────────────
    document.getElementById("filters").addEventListener("click", e => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.category;
      renderScams();
    });

    // ── Escape HTML ───────────────────────────────────
    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // ── Init ──────────────────────────────────────────
    loadScams();
  </script>
</body>
</html>
